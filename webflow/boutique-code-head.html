<!-- Pages « Kits d'aménagement » et « Accessoires » (/boutique/…) → Paramètres de la page → Custom code → Inside <head> tag -->
<style>
  /* L'attribut hidden doit gagner sur les display des classes Client First. */
  [data-boutique] [hidden], [data-cms-donnees] { display: none !important; }
  /* Rail des filtres ouvert en plein écran (mobile) : pas de défilement de la page derrière. */
  html.boutique-filtres-ouverts, html.boutique-filtres-ouverts body { overflow: hidden; }
</style>
