<!-- Page « Configurateur » → Paramètres de la page → Custom code → Inside <head> tag -->
<style>
  /* L'attribut hidden doit gagner sur les display des classes Client First. */
  [data-configurateur] [hidden], [data-gabarits], [data-cms-donnees] { display: none !important; }
  /* Anti-flash : tant que le script n'a pas rendu la page, les étapes et les listes restent invisibles. */
  html:not(.config-prete) [data-etape], html:not(.config-prete) [data-liste] { visibility: hidden; }
</style>
